[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-review"
version = "0.1.0"
description = "Fail-closed autonomous pull request review policy"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["mypy==2.3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
