name: Jev review

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: jev-review-${{ vars.JEV_REPOSITORY || github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: read
  pull-requests: read

env:
  JEV_REPOSITORY: ${{ vars.JEV_REPOSITORY }}
  JEV_CONFIG: config/production.json

jobs:
  dry-run:
    if: vars.JEV_ENABLED == 'true' && vars.JEV_EXECUTE != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted bot branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Poll pull requests (dry run)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$JEV_REPOSITORY"
          test -f "$JEV_CONFIG"
          python -m jev_review poll --repo "$JEV_REPOSITORY" --config "$JEV_CONFIG" --dry-run

  live:
    if: vars.JEV_ENABLED == 'true' && vars.JEV_EXECUTE == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: write
    steps:
      - name: Checkout trusted bot branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Poll pull requests (live, explicitly enabled)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -n "$JEV_REPOSITORY"
          test -f "$JEV_CONFIG"
          python -m jev_review poll --repo "$JEV_REPOSITORY" --config "$JEV_CONFIG" --execute
